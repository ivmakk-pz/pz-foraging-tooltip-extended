name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version, verify it matches mod.info and FTE_Utils
        id: v
        run: |
          ver="$GITHUB_REF_NAME"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          modver=$(grep -oP '^modversion=\K.*' Contents/mods/ForagingTooltipExtended/42/mod.info | tr -d '\r')
          [ "$modver" = "$ver" ] || { echo "::error::tag $ver != mod.info modversion $modver"; exit 1; }
          luaver=$(grep -oP 'FTE_Utils\.MOD_VERSION = "\K[^"]+' Contents/mods/ForagingTooltipExtended/42/media/lua/client/FTE_Utils.lua | tr -d '\r')
          [ "$luaver" = "$ver" ] || { echo "::error::tag $ver != FTE_Utils.MOD_VERSION $luaver"; exit 1; }

      - name: Build mod-folder zip
        run: |
          git archive --format=zip --prefix=ForagingTooltipExtended/ \
            "$GITHUB_REF_NAME:Contents/mods/ForagingTooltipExtended" -o "ForagingTooltipExtended-${{ steps.v.outputs.ver }}.zip"

      - name: Extract changelog notes + date
        run: |
          ver="${{ steps.v.outputs.ver }}"
          awk -v v="$ver" 'index($0,"## ["v"]")==1{g=1;next} g&&/^## \[/{exit} g' CHANGELOG.md > NOTES.md
          echo "date=$(grep -oP "^## \[$ver\] - \K.*" CHANGELOG.md | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME - $date" \
            --notes-file NOTES.md --latest \
            "ForagingTooltipExtended-${{ steps.v.outputs.ver }}.zip"
