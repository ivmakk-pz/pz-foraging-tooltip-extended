name: Bug report
description: Something in Foraging Tooltip Extended is broken or behaves wrong in-game.
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The game build, the mode, and a log excerpt are what make a bug reproducible, so please fill those in. General questions are better as a [Steam Workshop comment](https://steamcommunity.com/sharedfiles/filedetails/?id=3507997225).
  - type: input
    id: game-build
    attributes:
      label: Game build
      description: The Project Zomboid build you are on (title screen, bottom corner).
      placeholder: "42.20.2"
    validations:
      required: true
  - type: dropdown
    id: mod-version
    attributes:
      label: Mod version
      description: Foraging Tooltip Extended version (Workshop change notes, or the value in mod.info). Pick "Other / not listed" if yours isn't here.
      options:
        - "2.2.4"
        - "2.2.3"
        - "2.2.2"
        - "2.2.1"
        - "Other / not listed"
    validations:
      required: true
  - type: dropdown
    id: game-mode
    attributes:
      label: Game mode
      description: Where does it happen?
      options:
        - Singleplayer
        - Hosted co-op (in-game host)
        - Dedicated server
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: mod-isolation
    attributes:
      label: Does it still happen with other mods disabled?
      description: No need to list every enabled mod. Instead, test with only Foraging Tooltip Extended enabled and note what happens. That's the quickest way to rule out a conflict with another mod.
      options:
        - "Yes - it still happens with only Foraging Tooltip Extended enabled"
        - "No - it goes away when I disable my other mods"
        - "I haven't tested with other mods disabled"
    validations:
      required: true
  - type: input
    id: suspected-conflict
    attributes:
      label: Suspected conflicting mod (optional)
      description: If disabling other mods fixed it and you narrowed it down, name the mod (and its Workshop link if handy). Other mods that touch the foraging tooltip are the likeliest culprits.
    validations:
      required: false
  - type: textarea
    id: what-went-wrong
    attributes:
      label: What went wrong?
      description: What you did (step by step), what happened, and what you expected instead. If a screenshot shows the problem, drag it in here.
      placeholder: |
        1. Enter foraging search mode and hover the Vision Effectiveness tooltip
        2. ...
        3. What happened: ...
        4. What I expected: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Either paste the relevant lines, or drag in the full log files. Logs live in `%USERPROFILE%\Zomboid\Logs\`: the newest `*_DebugLog.txt` (client) and, for multiplayer, `*_DebugLog-server.txt` (server). `%USERPROFILE%\Zomboid\console.txt` also holds `[FTE]`-prefixed messages.
      placeholder: Paste the relevant lines, or drag the full log files here.
    validations:
      required: false
